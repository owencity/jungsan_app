name: CI

# **iOS 타깃을 안드로이드보다 먼저 CI 에 건다.**
# 개발은 안드로이드 위주로 가지만(맥·아이폰이 아직 없다), commonMain 에 JVM 전용
# API(예: java.math.BigInteger)가 섞여 들어가는 순간 iOS 빌드가 조용히 깨진다.
# 안드로이드가 90% 끝난 뒤에 iOS 를 열면 그 누적을 한꺼번에 치워야 한다 —
# 그래서 화면이 비어 있는 지금부터 "컴파일만" 매 푸시마다 검증한다.
#
# 이 저장소는 백엔드(jungsan_attack)와 분리돼 있다. 코덱스가 백엔드를 짜는 동안
# 이 워크플로는 앱만 본다 — 서로의 CI 를 기다리거나 건드릴 일이 없다.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다.
# macOS 러너 분은 공개 저장소라도 무한정은 아니라서, 낭비를 줄인다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (assemble + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 이미지에 Android SDK 가 이미 들어 있다(플랫폼·빌드도구 포함).
      # 그래서 setup-android 같은 별도 단계가 필요 없다 — 필요해지면(NDK 버전 등)
      # 그때 추가한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # gradlew/gradle-wrapper.jar 가 공식 배포본과 일치하는지 확인한다.
      # 이 프로젝트는 래퍼를 다른 저장소(jungsan_attack)에서 그대로 복사해 왔어서,
      # 손상되거나 바뀌지 않았는지 CI 에서 한 번 더 검증해두는 편이 안전하다.
      - uses: gradle/actions/wrapper-validation@v4

      - name: assemble + test
        run: ./gradlew :composeApp:assembleDebug :composeApp:allTests --console=plain --stacktrace

      - name: upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  ios-build:
    name: iOS (simulator app build + launch screenshot)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      # 실기기(arm64) 타깃은 시뮬레이터 빌드가 안 거치므로 컴파일만 따로 확인한다.
      - name: compile iOS device target
        run: ./gradlew :composeApp:compileKotlinIosArm64 --console=plain --stacktrace

      # 개발 PC가 윈도우라 .xcodeproj 를 커밋하지 않는다 — iosApp/project.yml 로 매번 만든다.
      - name: generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # 서명 없이 시뮬레이터용 앱을 만든다. Apple 개발자 계정(2026-10-06~)이 생기면 서명·업로드는
      # 별도 릴리스 워크플로가 맡는다. 러너가 Apple Silicon 이라 arm64 하나만 빌드한다.
      - name: build app (simulator, unsigned)
        id: build_ios_simulator
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            JS_API_BASE_URL=https://jungsan-api.devkdk.com \
            build-for-testing > xcodebuild.log 2>&1 || {
              # 로그는 인증 없이 못 읽는다 — 오류 줄을 annotation 으로 올려 공개 API 로 읽히게 한다
              grep -E "error:|^e: |FAILED|ld: |Undefined symbol|^ +\"_|referenced from" xcodebuild.log | head -n 40 \
                | while IFS= read -r l; do echo "::error::${l:0:900}"; done
              tail -n 40 xcodebuild.log
              exit 1
            }
          tail -n 20 xcodebuild.log

      # 실제로 뜨는지 본다 — 컴파일은 되는데 실행하자마자 죽는 경우(프레임워크 링크·초기화)를 잡는다.
      # 스크린샷은 아티팩트로 올려 사람이(그리고 Claude가) 눈으로 확인한다.
      - name: launch on simulator + screenshot
        timeout-minutes: 15
        run: |
          # JSON의 첫 기기는 이전 런타임일 수 있다. 실제 SDK와 가까운 최신 설치 iOS에서 검사한다.
          SIMULATOR_CHOICE=$(xcrun simctl list devices available -j | jq -c '
            [.devices | to_entries[] | select(.key | contains(".iOS-")) |
              .key as $runtime | .value[] | select(.name | startswith("iPhone")) |
              {udid, name, runtime: $runtime, version: ($runtime | split("iOS-")[1] | split("-") | map(tonumber))}]
            | sort_by(.version) | last')
          [ "$SIMULATOR_CHOICE" != "null" ] || { echo "::error::사용 가능한 iPhone 시뮬레이터가 없습니다"; exit 1; }
          UDID=$(echo "$SIMULATOR_CHOICE" | jq -r '.udid')
          echo "simulator $SIMULATOR_CHOICE"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Jeongsan.app
          xcrun simctl launch "$UDID" app.jeongsan
          sleep 25
          # 실행 직후 죽었으면 여기서 실패한다
          xcrun simctl spawn "$UDID" launchctl list | grep -q "app.jeongsan" || { echo "app not running"; exit 1; }
          mkdir -p shots && xcrun simctl io "$UDID" screenshot shots/ios-launch.png
          # XCTest는 화면 조작만 한다. 각 공유 시나리오 직후 호스트에서 실제 복사값을 대조한다.
          XCTESTRUN=$(find build/dd/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)
          [ -n "$XCTESTRUN" ] || { echo "::error::UI 테스트 실행 파일을 찾지 못했습니다"; exit 1; }
          for TEST_CASE in testEmptyNameCanBeCorrected testEmptyNameCanBeCorrectedWithKeyboard testPublicDemoRolesResetAndExit testShareCancelKeepsClipboard testShareUnavailableKakaoKeepsClipboard; do
            if [[ "$TEST_CASE" == testShare* ]]; then
              xcrun simctl bootstatus "$UDID" -b
              python3 .github/scripts/share_clipboard_probe.py seed "$UDID" "$TEST_CASE"
            fi
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,arch=arm64,id=$UDID" \
              -parallel-testing-enabled NO \
              -resultBundlePath "build/ios-review-ui-$TEST_CASE.xcresult" \
              -only-testing:"iosAppUITests/AppReviewUITests/$TEST_CASE" \
              > "ui-test-$TEST_CASE.log" 2>&1 || {
                grep -E "error:|failed|FAILED" "ui-test-$TEST_CASE.log" | tail -n 30 \
                  | while IFS= read -r l; do echo "::error::${l:0:900}"; done
                tail -n 35 "ui-test-$TEST_CASE.log"
                exit 1
              }
            tail -n 15 "ui-test-$TEST_CASE.log"
            if [[ "$TEST_CASE" == testShare* ]]; then
              xcrun simctl bootstatus "$UDID" -b
              python3 .github/scripts/share_clipboard_probe.py assert "$UDID" "$TEST_CASE"
            fi
          done
          xcrun simctl shutdown "$UDID"

      # iPhone 전용 앱도 iPad의 호환 화면으로 실행되므로 실제 제보 기종 계열에서 같은 회귀를 검사한다.
      - name: name retry on iPad compatibility screen
        if: ${{ !cancelled() && steps.build_ios_simulator.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          IPAD_CHOICE=$(xcrun simctl list devices available -j | jq -c '
            [.devices | to_entries[] | select(.key | contains(".iOS-")) |
              .key as $runtime | .value[] | select(.name | startswith("iPad")) |
              {udid, name, runtime: $runtime, version: ($runtime | split("iOS-")[1] | split("-") | map(tonumber))}]
            | sort_by(.version) | last')
          [ "$IPAD_CHOICE" != "null" ] || { echo "::error::사용 가능한 iPad 시뮬레이터가 없습니다"; exit 1; }
          UDID=$(echo "$IPAD_CHOICE" | jq -r '.udid')
          echo "name retry iPad $IPAD_CHOICE"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/dd/Build/Products/Debug-iphonesimulator/Jeongsan.app
          XCTESTRUN=$(find build/dd/Build/Products -maxdepth 1 -name '*.xctestrun' -print -quit)
          [ -n "$XCTESTRUN" ] || { echo "::error::UI 테스트 실행 파일을 찾지 못했습니다"; exit 1; }
          for TEST_CASE in testEmptyNameCanBeCorrected testEmptyNameCanBeCorrectedWithKeyboard; do
            xcodebuild test-without-building \
              -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,arch=arm64,id=$UDID" \
              -parallel-testing-enabled NO \
              -resultBundlePath "build/ios-review-ui-ipad-$TEST_CASE.xcresult" \
              -only-testing:"iosAppUITests/AppReviewUITests/$TEST_CASE" \
              > "ui-test-ipad-$TEST_CASE.log" 2>&1 || { tail -n 50 "ui-test-ipad-$TEST_CASE.log"; exit 1; }
            tail -n 15 "ui-test-ipad-$TEST_CASE.log"
          done

      - name: export UI screenshots
        timeout-minutes: 2
        if: always()
        run: |
          for RESULT in build/ios-review-ui-*.xcresult; do
            [ -d "$RESULT" ] || continue
            CASE_NAME=$(basename "$RESULT" .xcresult)
            xcrun xcresulttool export attachments --path "$RESULT" --output-path "shots/ui/$CASE_NAME"
          done

      - name: upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshot
          path: |
            shots/
            ui-test-*.log
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
