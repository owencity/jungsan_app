name: CI

# **iOS 타깃을 안드로이드보다 먼저 CI 에 건다.**
# 개발은 안드로이드 위주로 가지만(맥·아이폰이 아직 없다), commonMain 에 JVM 전용
# API(예: java.math.BigInteger)가 섞여 들어가는 순간 iOS 빌드가 조용히 깨진다.
# 안드로이드가 90% 끝난 뒤에 iOS 를 열면 그 누적을 한꺼번에 치워야 한다 —
# 그래서 화면이 비어 있는 지금부터 "컴파일만" 매 푸시마다 검증한다.
#
# 이 저장소는 백엔드(jungsan_attack)와 분리돼 있다. 코덱스가 백엔드를 짜는 동안
# 이 워크플로는 앱만 본다 — 서로의 CI 를 기다리거나 건드릴 일이 없다.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 푸시하면 앞선 실행은 취소한다.
# macOS 러너 분은 공개 저장소라도 무한정은 아니라서, 낭비를 줄인다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (assemble + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 이미지에 Android SDK 가 이미 들어 있다(플랫폼·빌드도구 포함).
      # 그래서 setup-android 같은 별도 단계가 필요 없다 — 필요해지면(NDK 버전 등)
      # 그때 추가한다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # gradlew/gradle-wrapper.jar 가 공식 배포본과 일치하는지 확인한다.
      # 이 프로젝트는 래퍼를 다른 저장소(jungsan_attack)에서 그대로 복사해 왔어서,
      # 손상되거나 바뀌지 않았는지 CI 에서 한 번 더 검증해두는 편이 안전하다.
      - uses: gradle/actions/wrapper-validation@v4

      - name: assemble + test
        run: ./gradlew :composeApp:assembleDebug :composeApp:allTests --console=plain --stacktrace

      - name: upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composeApp-debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 7

  ios-compile-check:
    name: iOS (compile only, no Mac dev machine yet)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: gradle/actions/wrapper-validation@v4

      # 실행 파일을 만드는 게 아니라 **컴파일이 통과하는지만** 본다.
      # Xcode 프로젝트·서명·TestFlight 업로드는 Codemagic 이 릴리스 시점에 담당한다
      # (역할 분리: Actions=CI 매 푸시, Codemagic=CD 릴리스만).
      - name: compile iOS targets
        run: |
          ./gradlew \
            :composeApp:compileKotlinIosArm64 \
            :composeApp:compileKotlinIosSimulatorArm64 \
            --console=plain --stacktrace
